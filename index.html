<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seattle, mapped</title>
<meta name="description" content="Interesting places in Seattle on an OpenStreetMap map, read from simple data files. Switch between datasets and filter each one.">
<style>
:root{
  --bg:#f4efe6; --panel:#fffdf8; --ink:#241f19; --muted:#675f53; --line:#e4dccd; --soft:#f3ede1;
  --accent:#a3401c; --accent-ink:#fff; --focus:#1b6ec2; --map-bg:#e9e4da;
  --shadow:0 6px 22px rgba(36,31,25,.20); --card:#fffdf8; --lbl:#7a705f; --lbl-water:#5b87aa; --warn:#8a5a00; --warn-bg:#fff4d6;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#14120d; --panel:#1e1b15; --ink:#f3ede0; --muted:#aaa190; --line:#393327; --soft:#2a261d;
    --accent:#f0996d; --accent-ink:#1b130d; --focus:#79b8ff; --map-bg:#2a2823; --shadow:0 6px 22px rgba(0,0,0,.55); --card:#25211a; --lbl:#b5ac99; --lbl-water:#7ea8c9; --warn:#f2cf7a; --warn-bg:#3a2f12; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:400px minmax(0,1fr);height:100vh;height:100dvh}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;position:relative;z-index:2;overscroll-behavior:contain}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden}

/* panel */
.head{padding:18px 20px 12px}
.kicker{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:650}
.dsnav{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 12px;padding:0 20px 4px;scrollbar-width:thin}
.dsnav button{flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--panel);font-weight:600}
.dsnav button .n{font-weight:500;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.dsnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
h1{margin:0;font:600 25px/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:-.01em}
.lede{margin:8px 0 0;color:var(--muted)}
.banner{margin:12px 0 0;padding:8px 10px;border-radius:9px;background:var(--warn-bg);color:var(--warn);font-size:12.5px}
.statusbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 20px;background:var(--panel);border-block:1px solid var(--line)}
.statusbar b{font-size:15px;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-weight:550}
.sec{padding:14px 20px 12px;border-bottom:1px solid var(--line)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
h2{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650}
output{font-weight:650;font-variant-numeric:tabular-nums}
.field{position:relative;display:block}
.field input{width:100%;height:38px;padding:0 34px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.field input::placeholder{color:var(--muted)}
.field .clr{position:absolute;right:4px;top:4px;width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:18px;border-radius:8px}
.eras{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.eras button{padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12.5px;white-space:nowrap}
.eras button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hist{display:grid;gap:3px;align-items:end;height:46px;margin:0 10px}
.hist i{display:block;background:var(--line);border-radius:3px 3px 0 0;min-height:2px;transition:height .2s,background .2s}
.hist i.on{background:color-mix(in srgb,var(--accent) 55%,var(--panel))}
.slider{position:relative;height:30px;margin:0 10px}
.slider .track,.slider .fill{position:absolute;top:13px;height:4px;border-radius:2px}
.slider .track{left:0;right:0;background:var(--line)}
.slider .fill{background:var(--accent)}
.slider input{position:absolute;left:-10px;width:calc(100% + 20px);top:0;height:30px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.slider input::-webkit-slider-runnable-track{background:transparent;height:30px}
.slider input::-moz-range-track{background:transparent;height:30px}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;margin-top:5px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:grab}
.slider input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:grab}
.ticks{position:relative;height:16px;margin:0 10px 8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%)}
.check{display:flex;align-items:flex-start;gap:9px;padding:5px 0;cursor:pointer}
.check input{margin:3px 0 0;accent-color:var(--accent)}
.check small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.check .n{color:var(--muted);font-variant-numeric:tabular-nums}
.types{list-style:none;margin:0;padding:0}
.types li{position:relative;display:flex;align-items:center;border-radius:8px}
.types li:hover{background:var(--soft)}
.trow{flex:1;display:flex;align-items:center;gap:9px;padding:6px 6px;cursor:pointer;min-width:0}
.trow input{margin:0;accent-color:var(--accent)}
.trow .tn{flex:1;min-width:0}
.trow .tc{color:var(--muted);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right;padding-right:6px}
.types li.zero .tn,.types li.zero .sw{opacity:.45}
.only{position:absolute;right:38px;top:50%;transform:translateY(-50%);border:0;background:var(--soft);border-radius:6px;color:var(--accent);padding:2px 8px;font-size:12px;opacity:0;font-weight:600}
.types li:hover .only,.only:focus-visible{opacity:1}
@media (hover:none){.only{opacity:1}}
.sw{display:inline-flex;width:20px;height:20px;flex:none}
.sw svg{width:20px;height:20px;overflow:visible}
.sw .shape{fill:var(--c);stroke:#fff;stroke-width:1.6;paint-order:stroke}
.hollow .shape{fill:#fff;stroke:var(--c);stroke-width:3}
.dashed .shape{stroke-dasharray:3.2 2.4}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px 6px}
.listhead select{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:4px 6px;font-size:13px}
.list{list-style:none;margin:0;padding:0 10px 8px}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:10px;background:none;text-align:left}
.item:hover,.item.hl{background:var(--soft)}
.item[aria-current="true"]{background:color-mix(in srgb,var(--accent) 14%,var(--panel));box-shadow:inset 3px 0 0 var(--accent)}
.item .im{flex:1;min-width:0;display:flex;flex-direction:column}
.item .in{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .is{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .iy{font-variant-numeric:tabular-nums;font-weight:650;color:var(--muted);white-space:nowrap}
.empty{margin:6px 20px 16px;padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.tools{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-weight:550}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fine{margin:0;padding:0 20px 22px;color:var(--muted);font-size:12px}
.fine a{color:inherit}

/* map */
#map{position:absolute;inset:0;background:var(--map-bg);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;overflow:hidden;outline:none}
#map.dragging{cursor:grabbing}
#tiles,#markers,#labels{position:absolute;left:0;top:0;width:100%;height:100%}
#tiles{overflow:hidden;z-index:0}
#markers{z-index:1}
#labels{z-index:0;pointer-events:none;display:none;overflow:hidden}
#map.notiles #labels{display:block}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;color:var(--lbl);text-shadow:0 0 3px var(--map-bg),0 0 3px var(--map-bg),0 0 6px var(--map-bg)}
.lbl.hood{font-weight:650;text-transform:uppercase;font-size:11px;letter-spacing:.09em}
.lbl.water{font-style:italic;color:var(--lbl-water);font-size:13px;letter-spacing:.04em}
.lbl.land::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lbl);margin-right:5px;vertical-align:1px}
.tile{position:absolute;left:0;top:0;width:256.6px;height:256.6px;transform-origin:0 0;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
@media (prefers-color-scheme:dark){.tile{filter:brightness(.82) contrast(1.05) saturate(.9)}}
.pin,.cluster{position:absolute;left:0;top:0;will-change:transform}
.pin{width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border:0;background:none;display:grid;place-items:center}
.pin svg{width:26px;height:26px;overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.5));transition:transform .12s}
.pin .shape{fill:var(--c);stroke:#fff;stroke-width:2;paint-order:stroke}
.pin.hollow .shape{fill:#fff;stroke:var(--c);stroke-width:3.4}
.pin.dashed .shape{stroke-dasharray:3.4 2.4}
.pin.approx{opacity:.8}
.pin:hover svg,.pin.hl svg{transform:scale(1.25)}
.pin:hover,.pin.hl{z-index:10}
.pin.sel{z-index:20}
.pin.sel svg{transform:scale(1.5);filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
.pin.sel::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid var(--accent);animation:ping 1.6s ease-out infinite;pointer-events:none}
@keyframes ping{from{transform:scale(1.4);opacity:.85}to{transform:scale(2.4);opacity:0}}
.cluster{display:grid;place-items:center;border-radius:50%;background:#2b2621;color:#fff;font-weight:700;border:3px solid rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.45);padding:0;font-size:13px;font-variant-numeric:tabular-nums}
.cluster:hover{background:var(--accent);color:var(--accent-ink)}
.pin.off{display:none}

.ctl{position:absolute;top:12px;right:12px;z-index:5;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.zoom{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.zoom button{width:38px;height:38px;border:0;background:none;font-size:20px;line-height:1;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--soft)}
.zoom svg{width:18px;height:18px}
.basemap{border:0;border-radius:10px;background:var(--card);box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px;max-width:190px}
.notice{position:absolute;z-index:5;top:12px;left:12px;right:70px;max-width:520px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:13px}
.notice .msg{flex:1 1 220px}
.notice .hint{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.notice .bar{flex:1 1 100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.notice .bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.notice .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.loading{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:550}
.toast{position:absolute;z-index:6;left:50%;bottom:44px;transform:translateX(-50%);max-width:min(520px,calc(100% - 24px));padding:10px 14px;border-radius:12px;background:#2b2621;color:#fff;box-shadow:var(--shadow);font-size:13px}
.attrib{position:absolute;z-index:4;right:0;bottom:0;padding:2px 8px;background:rgba(255,255,255,.82);color:#333;font-size:11px;border-top-left-radius:6px}
.attrib a{color:#0b5cad}
.card{position:absolute;z-index:7;left:12px;bottom:30px;width:min(380px,calc(100% - 24px));max-height:calc(100% - 90px);overflow:auto;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 16px 14px}
.card .x{position:absolute;top:6px;right:6px;width:32px;height:32px;border:0;border-radius:8px;background:none;font-size:20px;color:var(--muted)}
.card .x:hover{background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 28px 8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 5px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:600}
.chip .sw,.chip .sw svg{width:16px;height:16px}
.chip.conf{padding-left:9px}
.chip.conf i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.card h3{margin:0 0 2px;font:600 20px/1.2 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.card .yr{margin:0 0 8px;color:var(--muted);font-size:13px}
.card .yr b{color:var(--ink);font-size:22px;margin-right:6px;font-variant-numeric:tabular-nums;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.card .addr{margin:0 0 8px;font-weight:550}
.card .addr span{color:var(--muted);font-weight:400}
.card .notes{margin:0 0 8px;color:var(--ink);opacity:.9;font-size:13px;max-height:9.5em;overflow:auto;padding-right:4px;white-space:pre-line}
.card .meta{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.card .meta div{margin:1px 0;overflow-wrap:anywhere}
.card .meta a{color:var(--accent)}
.card .links{display:flex;flex-wrap:wrap;gap:8px 14px}
.card .links a{color:var(--accent);font-weight:600;text-underline-offset:2px}
.card .pos{margin:10px 0 0;font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:54vh minmax(0,1fr);grid-template-rows:54dvh minmax(0,1fr)}
  .mapwrap{order:-1}
  .panel{border-right:0;border-top:1px solid var(--line)}
  .head{padding:12px 16px 8px} .dsnav{margin:0 -16px 10px;padding:0 16px 4px} h1{font-size:21px} .lede{font-size:13px;margin-top:4px}
  .statusbar,.sec,.listhead,.tools{padding-left:16px;padding-right:16px} .fine{padding-left:16px;padding-right:16px}
  .card{left:8px;right:8px;width:auto;bottom:26px;max-height:min(62%,360px);padding:12px 14px}
  .card .notes{max-height:5.5em}
  .card h3{font-size:18px}
  .notice{left:8px;right:60px;top:8px;font-size:12.5px;padding:7px 10px}
  .notice .hint{display:none}
  .notice .btn{padding:5px 10px;font-size:12.5px}
  .mapwrap.has-card .notice{display:none}
  .ctl{top:8px;right:8px}
  .basemap{display:none}
}
@media (prefers-reduced-motion:reduce){.pin.sel::after{animation:none}.hist i{transition:none}}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="app">
  <aside class="panel" id="panel" aria-label="Datasets, filters and results">
    <div class="head">
      <p class="kicker" id="siteTitle">Seattle, mapped</p>
      <nav class="dsnav" id="dsnav" aria-label="Datasets" hidden></nav>
      <h1 id="dsTitle">Loading…</h1>
      <p class="lede" id="dsDesc"></p>
      <p class="banner" id="banner" hidden></p>
    </div>
    <div class="statusbar" role="status" aria-live="polite">
      <span><b id="showing">0</b> <span id="ofTotal"></span> shown</span>
      <button class="linkbtn" id="reset" type="button">Reset filters</button>
    </div>

    <section class="sec" aria-label="Search">
      <label class="field"><span class="sr">Search this dataset</span>
        <input id="q" type="search" placeholder="Search name, address or neighborhood" autocomplete="off" spellcheck="false">
        <button class="clr" id="qclr" type="button" aria-label="Clear search" hidden>×</button>
      </label>
    </section>

    <section class="sec" id="secYear" aria-labelledby="h-year" hidden>
      <div class="sec-head"><h2 id="h-year">Year</h2><output id="yrOut" for="y0 y1">Any year</output></div>
      <div class="eras" id="eras" role="group" aria-label="Quick year ranges"></div>
      <div class="hist" id="hist" aria-hidden="true"></div>
      <div class="slider">
        <div class="track"></div><div class="fill" id="fill"></div>
        <input id="y0" type="range" aria-label="Earliest year">
        <input id="y1" type="range" aria-label="Latest year">
      </div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
      <label class="check" id="lblBy"><input type="checkbox" id="inclBy" checked>
        <span><span class="sw hollow" id="swBy"></span></span>
        <span>Include “minimum” years <span class="n" id="nBy"></span>
          <small>Hollow pins: the year is a minimum (“By 19xx”), so the real year may be earlier.</small></span></label>
      <label class="check" id="lblNone"><input type="checkbox" id="inclNone" checked>
        <span><span class="sw hollow dashed" id="swNone"></span></span>
        <span>Include year unclear <span class="n" id="nNone"></span></span></label>
    </section>

    <section class="sec" id="secType" aria-labelledby="h-type" hidden>
      <div class="sec-head"><h2 id="h-type">Type</h2>
        <span><button class="linkbtn" id="tAll" type="button">All</button> · <button class="linkbtn" id="tNone" type="button">None</button></span></div>
      <ul class="types" id="types"></ul>
    </section>

    <div class="listhead">
      <h2>Results</h2>
      <label><span class="sr">Sort results</span>
        <select id="sort"><option value="year">Earliest year first</option><option value="name">Name A–Z</option><option value="hood">Neighborhood</option></select></label>
    </div>
    <ol class="list" id="list"></ol>
    <div class="empty" id="empty" hidden>Nothing matches these filters. <button class="linkbtn" id="reset2" type="button">Reset filters</button></div>

    <div class="tools">
      <button class="btn" id="csv" type="button">Download these as CSV</button>
    </div>
    <p class="fine" id="fine">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.</p>
  </aside>

  <main class="mapwrap" id="mapwrap">
    <div id="map" tabindex="0" role="application" aria-label="Map. Drag to pan, scroll to zoom.">
      <div id="tiles"></div>
      <div id="labels" aria-hidden="true"></div>
      <div id="markers"></div>
    </div>
    <div class="notice" id="notice" role="status" hidden>
      <span class="msg"><span id="noticeMsg"></span> <span class="hint" id="noticeHint"></span></span>
      <button class="btn primary" id="snap" type="button">Snap pins to addresses</button>
      <button class="x" id="noticeX" type="button" aria-label="Dismiss" hidden>×</button>
      <div class="bar" id="snapBar" hidden><div></div></div>
    </div>
    <div class="ctl">
      <div class="zoom">
        <button id="zin" type="button" aria-label="Zoom in">+</button>
        <button id="zout" type="button" aria-label="Zoom out">−</button>
        <button id="fit" type="button" aria-label="Fit map to the places shown" title="Fit to results"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
      </div>
      <select class="basemap" id="basemap" aria-label="Map tiles">
        <option value="osm">OpenStreetMap</option>
        <option value="carto">OSM data · CARTO style</option>
      </select>
    </div>
    <div class="loading" id="loading" role="status">Loading data…</div>
    <div class="toast" id="toast" role="status" hidden></div>
    <article class="card" id="card" hidden aria-live="polite"></article>
    <div class="attrib" id="attrib"></div>
  </main>
</div>

<script>
(() => {
'use strict';
/* ====================================================================================
   Settings come from config.js (window.MAP_CONFIG). The data is read from CSV files in
   the data/ folder (datasets.csv, an optional types.csv, and one file per dataset), or,
   if sheetId is set, live from a Google Sheet with the same tabs.

let gvN = 0;
function cellVal(c, col) {
  if (c == null) return '';
  const t = col && col.type;
  if ((t === 'date' || t === 'datetime' || t === 'timeofday') && c.f != null) return c.f;
  return c.v == null ? (c.f == null ? '' : c.f) : c.v;
}
function tableToTab(t) {
  const cols = t.cols || [];
  let labels = cols.map(c => txt(c.label));
  let rows = (t.rows || []).map(r => { const a = (r.c || []).map((c, i) => cellVal(c, cols[i])); while (a.length < cols.length) a.push(''); return a; });
  if (!labels.some(Boolean) && rows.length) { labels = rows[0].map(txt); rows = rows.slice(1); }
  return {labels, rows};
}
function gviz(tab) {
  return new Promise((resolve, reject) => {
    const cb = `__gv${++gvN}_${Math.random().toString(36).slice(2, 8)}`;
    const s = document.createElement('script');
    let timer = 0, finished = false;
    const done = (err, val) => {
      if (finished) return; finished = true; clearTimeout(timer);
      try { delete window[cb]; } catch { window[cb] = undefined; }
      s.remove(); err ? reject(err) : resolve(val);
    };
    window[cb] = r => {
      if (r && r.status === 'ok' && r.table) return done(null, tableToTab(r.table));
      const m = r && r.errors && r.errors[0];
      done(new Error(m ? (m.detailed_message || m.message || m.reason) : 'The sheet returned an error.'));
    };
    s.onerror = () => done(new Error('The sheet couldn’t be loaded. Check your connection, and that sharing is set to “Anyone with the link: Viewer”.'));
    /* a script that loads but never calls back is Google's sign-in page: the sheet isn't shared publicly */
    s.onload = () => done(new Error('The sheet isn’t shared publicly. In Google Sheets choose Share → General access → Anyone with the link → Viewer.'));
    timer = setTimeout(() => done(new Error('The sheet took too long to answer.')), 20000);
    s.src = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(CFG.sheetId)}/gviz/tq?headers=1&sheet=${encodeURIComponent(tab)}&tqx=${encodeURIComponent('out:json;responseHandler:' + cb)}`;
    document.head.appendChild(s);
  });
}
const col = (tab, ...names) => { const low = tab.labels.map(l => l.toLowerCase()); for (const n of names) { const i = low.indexOf(n); if (i >= 0) return i; } return -1; };
function parseDatasetsTab(tab) {
  const iName = col(tab, 'dataset', 'name');
  if (iName < 0) throw new Error('The “Datasets” tab needs a column headed “Dataset”.');
  const ix = {tab: col(tab, 'tab', 'sheet'), desc: col(tab, 'description'), yl: col(tab, 'year label'), tl: col(tab, 'type label'), eras: col(tab, 'eras'), place: col(tab, 'place', 'default place')};
  const g = (r, k) => ix[k] >= 0 ? txt(r[ix[k]]) : '';
  const out = [], seen = new Set();
  for (const r of tab.rows) {
    const name = txt(r[iName]); if (!name) continue;
    let slug = slugify(name); while (seen.has(slug)) slug += '-2'; seen.add(slug);
    out.push({name, slug, tab: g(r, 'tab') || name, desc: g(r, 'desc'), yearLabel: g(r, 'yl') || 'Year', typeLabel: g(r, 'tl') || 'Type', eras: g(r, 'eras'), place: g(r, 'place')});
  }

}
function parseTypesTab(tab) {
  if (!tab) return [];
  const iD = col(tab, 'dataset'), iT = col(tab, 'type'), iC = col(tab, 'color', 'colour'), iS = col(tab, 'shape');
  if (iD < 0 || iT < 0) return [];
  return tab.rows.map(r => ({dataset: txt(r[iD]).toLowerCase(), type: txt(r[iT]), color: iC >= 0 ? txt(r[iC]) : '', shape: iS >= 0 ? txt(r[iS]).toLowerCase() : ''})).filter(t => t.type);
}

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false, i = 0;
  text = text.replace(/^﻿/, '');
  for (; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}
async function csvTab(tab) {

  const all = parseCSV(await res.text());

  const head = ['Name', 'Type', 'Year', 'Year basis', 'Address', 'Neighborhood', 'Latitude', 'Longitude', 'Position', 'Confidence', 'Notes', 'Source link', ...extraNames];
  const out = [head];
  for (const d of rows.filter(x => x._on)) out.push([d.name, d.type, d.year ?? '', d.yk === 'exact' ? 'Sourced' : d.yk === 'approx' ? 'Approximate' : d.yk === 'by' ? 'Minimum' : 'Unclear', d.addr, d.hood,
    hasPos(d) ? d.lat.toFixed(6) : '', hasPos(d) ? d.lon.toFixed(6) : '', !hasPos(d) ? (d.unmapped ? 'Unmapped' : '') : d.snapped ? 'Geocoded' : d.approx ? 'Approximate' : '', d.conf, d.notes, d.src, ...extraNames.map(n => (d.extra.find(e => e[0] === n) || [, ''])[1])]);
  const csv = '﻿' + out.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = slugify(DS.cfg.name) + '-map.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

/* ====================================================================================
   Finding map positions from addresses (OpenStreetMap Nominatim, in the viewer's browser)
   - rows with no latitude/longitude are looked up automatically (up to 30 per visit)
   - rows marked Position = Approximate can be refined with the "Snap pins" button
   Results are remembered in this browser only; put real coordinates in the data to fix them for everyone.
   ==================================================================================== */
const GEOKEY = 'seamap.geo.v1';
let geoCache = {}; try { geoCache = JSON.parse(lsGet(GEOKEY) || '{}') || {}; } catch { geoCache = {}; }
let geoRunning = false, geoStop = false;
const cleanStreet = a => a.replace(/^(\d+)\s*(?:-|–|and|&)\s*\d+\b/i, '$1').replace(/^(\d+)[A-Za-z]\b/, '$1').replace(/\s+1\/2\b/, '').replace(/,?\s*(suite|ste|unit|#)\s*\S+$/i, '');
const geoQuery = d => d.addr ? [cleanStreet(d.addr), d.place].filter(Boolean).join(', ') : '';
function applyGeoCache(ds) {
  for (const d of ds.rows) {
    if (d.lat != null && !d.approx) continue;
    const c = geoCache[geoQuery(d)];
    if (c && c.length === 2) { if (d.lat != null) d.est = [d.lat, d.lon]; d.lat = c[0]; d.lon = c[1]; d.snapped = true; d.approx = false; }
  }
}
const distKm = (a, b, c, d) => { const R = 6371, t = Math.PI / 180, dl = (c - a) * t, dn = (d - b) * t; const h = Math.sin(dl / 2) ** 2 + Math.cos(a * t) * Math.cos(c * t) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
async function geocode(d) {
  const q = geoQuery(d); if (!q) return null;
  const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=4&countrycodes=us&q=' + encodeURIComponent(q), {headers: {Accept: 'application/json'}});
  if (!res.ok) { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
  for (const r of await res.json()) {
    if (r.category === 'highway' || r.category === 'boundary') continue;
    const lat = +r.lat, lon = +r.lon; if (!isFinite(lat) || !isFinite(lon)) continue;
    const ref = d.est || (d.lat != null ? [d.lat, d.lon] : null);
    if (ref && distKm(lat, lon, ref[0], ref[1]) > 5) continue;
    return {lat, lon, q};
  }
  return null;
}
const noticeEl = $('#notice'), noticeMsg = $('#noticeMsg'), hint = $('#noticeHint'), snapBtn = $('#snap'), noticeX = $('#noticeX'), snapBar = $('#snapBar');
let geoProgress = null;
function noticeIdle() {
  if (!DS) return;
  const na = rows.filter(d => d.approx && !d.snapped && d.addr).length, nm = rows.filter(d => !hasPos(d) && !d.unmapped).length;
  snapBar.hidden = true; snapBtn.disabled = false; hint.hidden = true;
  if (geoProgress) { noticeEl.hidden = false; return; }
  if (noTilesMode && inFrame && na) {
    snapBtn.hidden = true; noticeX.hidden = false; noticeEl.hidden = false;
    noticeMsg.textContent = `${na} pin${na > 1 ? 's are' : ' is'} approximate. Snapping them to addresses needs the page opened in a normal browser tab.`; return;
  }
  if (na) {
    noticeMsg.textContent = `${na} pin${na > 1 ? 's are' : ' is'} approximate.`; snapBtn.textContent = 'Snap pins to addresses'; snapBtn.hidden = false; noticeX.hidden = false;
    hint.textContent = 'Snap looks up each street address on OpenStreetMap and moves the pin there (about a second per pin; remembered in this browser).'; hint.hidden = false; noticeEl.hidden = false;
  } else if (nm) {
    noticeMsg.textContent = `${nm} place${nm > 1 ? 's have' : ' has'} no map position yet. Add an address or latitude/longitude in the data.`;
    snapBtn.hidden = true; noticeX.hidden = false; noticeEl.hidden = false;
  } else noticeEl.hidden = true;
}
noticeX.onclick = () => { noticeEl.hidden = true; };
let geoTok = 0;
async function geoRun(list, label) {
  if (geoRunning) return;
  geoRunning = true; geoStop = false;
  const myDS = DS, tok = ++geoTok;
  let done = 0, ok = 0, miss = 0, netFail = 0, fatal = '';
  geoProgress = true; snapBtn.hidden = false; snapBtn.textContent = 'Stop'; snapBar.hidden = false; noticeX.hidden = true; noticeEl.hidden = false;
  const bar = snapBar.firstElementChild;
  for (const d of list) {
    if (geoStop || DS !== myDS || tok !== geoTok) break;
    noticeMsg.textContent = `${label} ${done} of ${list.length}`;
    bar.style.width = (done / list.length * 100) + '%';
    try {
      const r = await geocode(d); netFail = 0;
      if (r) { if (d.lat != null) d.est = [d.lat, d.lon]; d.lat = r.lat; d.lon = r.lon; d.snapped = true; d.approx = false; geoCache[r.q] = [+r.lat.toFixed(6), +r.lon.toFixed(6)]; ok++; } else miss++;
    } catch (err) {
      if (err.status === 429) { fatal = 'OpenStreetMap’s address search asked us to slow down. Try again in a few minutes.'; break; }
      if (err.status === 403) { fatal = 'OpenStreetMap’s address search declined the request. Try again later.'; break; }
      if (++netFail >= 3) { fatal = 'Couldn’t reach OpenStreetMap’s address search. Check your connection and try again.'; break; }
      miss++;
    }
    done++;
    lsSet(GEOKEY, JSON.stringify(geoCache));
    if (DS === myDS) { lastZq = -1; render(); if (sel != null) select(sel, {fly: false}); }
    await sleep(1100);
  }
  const stopped = geoStop, mine = tok === geoTok;
  if (mine) { geoRunning = false; geoProgress = null; }
  if (mine && DS === myDS) {
    apply({fit: false});
    if (ok && !userMoved) fitVisible();
    noticeIdle();
    if (fatal) { noticeMsg.textContent = fatal; noticeEl.hidden = false; }
    else if (stopped) noticeMsg.textContent += ' (stopped)';
    else if (miss) { noticeMsg.textContent = `${noticeMsg.textContent} ${miss} address${miss > 1 ? 'es were' : ' was'} not found.`; noticeEl.hidden = false; }
  }
}
snapBtn.onclick = () => {
  if (geoRunning) { geoStop = true; snapBtn.textContent = 'Stopping…'; return; }
  geoRun(rows.filter(d => d.approx && !d.snapped && d.addr), 'Looking up addresses on OpenStreetMap…');
};
function startAutoGeocode() {
  const todo = rows.filter(d => !hasPos(d) && !d.unmapped && d.addr).slice(0, 30);
  if (todo.length && !(noTilesMode && inFrame)) geoRun(todo, 'Locating places from their addresses…');
}

/* ====================================================================================
   Start-up: show cached or built-in data right away, then refresh from the sheet
   ==================================================================================== */
const CACHEKEY = () => 'seamap.cache.v1.' + (CFG.sheetId || 'files:' + CFG.data);
const SRCNAME = () => CFG.sheetId ? 'the Google Sheet' : 'the data files';
function readCache() { try { return JSON.parse(lsGet(CACHEKEY()) || 'null'); } catch { return null; } }
function setBanner(msg) { const b = $('#banner'); if (msg) { b.textContent = msg; b.hidden = false; b.dataset.keep = '1'; } else { b.hidden = true; delete b.dataset.keep; } }
function show(raw, init) {
  MODEL = makeModel(raw);
  buildNav();
  const want = (init && init.d) || (DS && DS.cfg.slug);
  activate(MODEL.list.some(d => d.slug === want) ? want : MODEL.list[0].slug, init);
  $('#loading').hidden = true;
}
async function boot() {
  $('#siteTitle').textContent = CFG.title;
  $('#basemap').value = provider; $('#attrib').innerHTML = PROVIDERS[provider].attrib;
  measure();
  const init = readHash();
  if (!CFG.sheetId && !CFG.data) {
    if (!SAMPLE) { $('#dsTitle').textContent = 'No data yet'; $('#dsDesc').textContent = 'Set data or sheetId in config.js to show your data.'; $('#loading').hidden = true; return; }
    show(SAMPLE, init);
    setBanner('Showing the built-in sample data. To show your own data, set data or sheetId in config.js.');
    $('#fine').innerHTML += ' Data: built-in sample.';
    return;
  }
  const cached = readCache();
  if (cached) show(cached, init);
  try {
    const fresh = await fetchModel();
    const s = JSON.stringify(fresh);
    if (!cached || JSON.stringify(cached) !== s) { lsSet(CACHEKEY(), s); show(fresh, cached ? currentState() : init); }
    setBanner('');
    $('#loading').hidden = true;
  } catch (e) {
    console.warn('Data load failed:', e);
    if (cached) setBanner(`Couldn’t refresh from ${SRCNAME()} (${e.message}). Showing the last data this browser loaded.`);
    else if (SAMPLE) { show(SAMPLE, init); setBanner(`Couldn’t read ${SRCNAME()} (${e.message}) so this is the built-in sample data.`); }
    else { $('#dsTitle').textContent = 'Couldn’t load the data'; $('#dsDesc').textContent = e.message; $('#loading').hidden = true; }
  }
}
window.__seamap = {get DS() { return DS; }, get rows() { return rows; }, get F() { return F; }, view, activate, select, get tiles() { return {ok: tileOK, err: tileErr, provider}; }, setProvider};
boot();
})();
</script>
